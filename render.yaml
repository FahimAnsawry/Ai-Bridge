services:
  - type: web
    name: ai-bridge
    runtime: node
    plan: free
    buildCommand: npm install && npm install --include=dev --prefix apps/client && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://ai-bridge-zag2.onrender.com
      - key: PUBLIC_URL
        value: https://ai-bridge-zag2.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://ai-bridge-zag2.onrender.com/auth/google/callback
      - key: ADMIN_EMAILS
        sync: false
